services:
  restaurantsaas_api:
    image: ${DOCKER_REGISTRY-}restaurantsaasapi
    build:
      context: .
      dockerfile: RestaurantSaas_Api/Dockerfile
    environment:
      # The API talks to the SQL Server container, not to localhost.
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=RestaurantSaaS;User Id=sa;Password=${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd};TrustServerCertificate=True;"
      Jwt__Key: "${JWT_KEY:-local-dev-only-secret-key-change-me-32chars-minimum}"
      # The project has no EF migrations yet, so the schema is created on first start.
      Database__AutoCreate: "true"
    depends_on:
      sqlserver:
        condition: service_healthy

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-YourStrong!Passw0rd}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      # -C trusts the self-signed certificate inside the container.
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  sqlserver-data:
